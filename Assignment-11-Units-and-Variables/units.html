<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Units</title>
  <style>
.fixed { width: 200px; height: 40px; background: lightblue; margin-bottom: 10px; }
.half { width: 50%; height: 40px; background: lightgreen; }
p { font-size: 1.5rem; }
</style>
</head>
<body>
<div class="fixed">200px wide</div>
<div class="half">50% wide</div>
<p>This paragraph uses a larger font size of 1.5rem.</p>
</body>
</html>
