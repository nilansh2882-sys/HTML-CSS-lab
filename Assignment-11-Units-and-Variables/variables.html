<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables</title>
  <style>
:root { --main-color: #1d3557; --accent-color: #e63946; --page-padding: 20px; }
body { color: var(--main-color); padding: var(--page-padding); }
h1 { color: var(--accent-color); }
</style>
</head>
<body>
<h1>CSS Variables</h1>
<p>CSS custom properties make it easier to manage a consistent design.</p>
</body>
</html>
