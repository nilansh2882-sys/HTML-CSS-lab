<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Cards</title>
  
  
  <style>
.row { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 260px; flex-wrap: wrap; }
.card { border: 1px solid #777; padding: 20px; width: 150px; text-align: center; background: #f2f2f2; }
</style>
</head>
<body>
<div class="row">
  <div class="card"><h3>Starter</h3><p>Price: 199</p></div>
  <div class="card"><h3>Standard</h3><p>Price: 349</p></div>
  <div class="card"><h3>Premium</h3><p>Price: 499</p></div>
</div>
</body>
</html>
