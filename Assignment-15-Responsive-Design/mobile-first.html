<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile First Layout</title>
  
  
  <style>
.cards { display: flex; flex-direction: column; gap: 16px; }
.card { padding: 18px; background: #e8f1ff; border: 1px solid #789; }
@media (min-width: 600px) { .cards { flex-direction: row; } .card { flex: 1; } }
</style>
</head>
<body>
<h1>Responsive Cards</h1>
<div class="cards">
  <div class="card"><h2>Card One</h2><p>This is the first responsive card.</p></div>
  <div class="card"><h2>Card Two</h2><p>This is the second responsive card.</p></div>
</div>
</body>
</html>
