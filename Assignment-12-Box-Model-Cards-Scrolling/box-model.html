<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model</title>
  
  
  <style>
* { margin-bottom: 16px; }
.content-box { box-sizing: content-box; width: 200px; padding: 20px; border: 5px solid navy; background: lightblue; }
.border-box { box-sizing: border-box; width: 200px; padding: 20px; border: 5px solid darkgreen; background: lightgreen; }
</style>
</head>
<body>
<div class="content-box">content-box</div>
<div class="border-box">border-box</div>
</body>
</html>
