<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Areas</title>
  
  
  <style>
.dashboard { display: grid; grid-template-columns: 200px 1fr; grid-template-areas: 'header header' 'sidebar main' 'footer footer'; gap: 10px; }
header { grid-area: header; } aside { grid-area: sidebar; } main { grid-area: main; min-height: 180px; } footer { grid-area: footer; }
header, aside, main, footer { background: #dce8f5; padding: 20px; }
</style>
</head>
<body>
<div class="dashboard">
  <header>Header</header><aside>Sidebar</aside><main>Main Area</main><footer>Footer</footer>
</div>
</body>
</html>
